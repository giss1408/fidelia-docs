site_name: Fidelia — Documentation
site_description: Business, regulation and technical documentation of Fidelia.
copyright: Fidelia, un produit de MILIKEY ENERGY SARLU (RCCM CI-ABJ-03-2023-B13-07947) — contact.fidelia@regisse.com
repo_url: https://github.com/giss1408/fidelia-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  # The Fidelia mark, copied from fidelia-brand/fidelia-mark.svg.
  logo: assets/fidelia-mark.svg
  favicon: assets/fidelia-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
      # GitHub-style anchors, so links written for GitHub (e.g. ROADMAP.md#phase-1--…) work here too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: [en, fr]
  # Two sites from one source: page.md is English (served at /), page.fr.md is
  # French (served at /fr/). A page with no French file falls back to English.
  # Link to page.md from either language; the plugin picks the right one.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Fidelia — Documentation
          site_description: Documentation business, réglementaire et technique de Fidelia.
          nav:
            - Accueil: README.md
            - Business:
                - Concept: business/CONCEPT.md
                - Marché: business/MARKET.md
                - Modèle économique: business/BUSINESS-MODEL.md
                - Feuille de route: business/ROADMAP.md
                - Indicateurs clés: business/KPI.md
                - Partenaires: business/PARTNERS.md
                - Investisseurs:
                    - Dossier investisseur: business/INVESTOR-BRIEF.md
                    - Préparation à la levée: business/INVESTOR-READINESS.md
                    - Lettres d'intérêt: business/LETTERS-OF-INTEREST.md
                - Finances: business/FINANCE.md
                - Proposition pilote Fin'ELLE: business/PROPOSITION-PILOTE-FINELLE.md
            - Réglementation:
                - Données personnelles et ARTCI: Reglementation/ARTCI.md
            - Technique:
                - Guide technique: technical/TECHNICAL-GUIDE.md
                - Inscription des utilisateurs: technical/ENROLLMENT.md
                - Déploiement de test: technical/DEPLOY-TEST.md
                - Serveur de test VPS: technical/VPS-TEST-SERVER.md
                - Production: technical/PRODUCTION.md
                - Google Play: technical/PLAY-STORE.md

nav:
  - Home: README.md
  - Business:
      - Concept: business/CONCEPT.md
      - Market: business/MARKET.md
      - Business model: business/BUSINESS-MODEL.md
      - Roadmap: business/ROADMAP.md
      - KPIs: business/KPI.md
      - Partners: business/PARTNERS.md
      - Investors:
          - Investor brief: business/INVESTOR-BRIEF.md
          - Investor readiness: business/INVESTOR-READINESS.md
          - Letters of interest: business/LETTERS-OF-INTEREST.md
      - Finance: business/FINANCE.md
  - Regulation:
      - Personal data and ARTCI: Reglementation/ARTCI.md
  - Technical:
      - Technical guide: technical/TECHNICAL-GUIDE.md
      - User enrollment: technical/ENROLLMENT.md
      - Test deployment: technical/DEPLOY-TEST.md
      - VPS test server: technical/VPS-TEST-SERVER.md
      - Production: technical/PRODUCTION.md
      - Google Play: technical/PLAY-STORE.md
